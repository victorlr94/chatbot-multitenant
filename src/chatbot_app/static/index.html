<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente virtual</title>
  <style>
    :root { --brand: #2563eb; --bg: #f4f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg);
           display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat { width: min(480px, 95vw); height: min(680px, 92vh); background: #fff;
            border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
            display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--brand); color: #fff; padding: 14px 18px; font-weight: 600; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex;
                flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px;
           line-height: 1.4; white-space: pre-wrap; font-size: .95rem; }
    .user { align-self: flex-end; background: var(--brand); color: #fff;
            border-bottom-right-radius: 4px; }
    .bot  { align-self: flex-start; background: #eef1f7; color: #111;
            border-bottom-left-radius: 4px; }
    .typing { align-self: flex-start; color: #888; font-size: .85rem; padding: 0 6px; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
    input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 10px;
            font-size: .95rem; outline: none; }
    input:focus { border-color: var(--brand); }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 10px;
             padding: 0 18px; font-size: .95rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="chat">
    <header>Asistente virtual</header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" placeholder="Escribe tu mensaje…" autocomplete="off" maxlength="2000">
      <button id="send" type="submit">Enviar</button>
    </form>
  </div>
  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let sessionId = sessionStorage.getItem("chat_session") || null;

    function add(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    add("¡Hola! ¿En qué puedo ayudarte?", "bot");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, "user");
      input.value = "";
      send.disabled = true;
      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "Escribiendo…";
      messages.appendChild(typing);
      messages.scrollTop = messages.scrollHeight;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await res.json();
        sessionId = data.session_id;
        sessionStorage.setItem("chat_session", sessionId);
        typing.remove();
        add(data.reply, "bot");
      } catch {
        typing.remove();
        add("Hubo un problema de conexión. Inténtalo de nuevo.", "bot");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
